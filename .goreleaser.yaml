version: 2
project_name: enklava

before:
  hooks:
    - go mod download

builds:
  - id: enklava
    main: ./cmd/enklava
    binary: enklava
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nklmilojevic/enklava/internal/cli.Version={{ .Version }}
    goos: [darwin]
    goarch: [amd64, arm64]
  - id: enklava-sign
    main: ./cmd/enklava-sign
    binary: enklava-sign
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [darwin]
    goarch: [amd64, arm64]

# macOS binaries are signed and notarized when the signing secrets exist
# (GoReleaser uses quill for this); without them the step is skipped.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [enklava, enklava-sign]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Release notes come from `gh release create`; GoReleaser only attaches the
# binaries to that release.
changelog:
  disable: true

release:
  mode: keep-existing
